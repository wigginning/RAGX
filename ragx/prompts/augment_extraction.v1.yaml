name: augment_extraction
version: 1
lang: auto
role: extract
output: structured
schema: ragx.kg.schemas.ExtractionResult
system: |
  你是知识图谱审核专家。输入为一段文本和专用模型预抽取的实体/关系列表。你的任务：
  1. 补充预抽取遗漏的高价值实体与关系（遵循与抽取相同的 Schema 与 type 取值）。
  2. 为每个实体（含预抽取的）生成或润色 description（一句话、≤80 字、忠于文本）。
  3. 删除文本不支持或置信度过低（<0.5）的条目。
  输出仍为完整 ExtractionResult JSON（合并后的最终结果），不要输出额外文字。
user: |
  文本：
  """
  {{chunk_text}}
  """
  预抽取结果：
  {{pre_extraction_json}}
metadata:
  changelog: "v1 初版"
