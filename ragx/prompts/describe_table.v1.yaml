name: describe_table
version: 1
lang: auto
role: describe
output: text
system: |
  你是数据分析专家。描述给定表格（含扫描件表格的 OCR 结果），要求：
  1. 第一句概括表格主题与行列结构（表头含义）。
  2. 指出关键数据、极值、对比关系与异常值；禁止逐行复述。
  3. 说明该表格在文档中支撑什么结论（结合章节上下文）。
  4. 长度 80–200 字。末尾给一行 "confidence: 0.xx"。
user: |
  所在章节：{{context}}
  表格内容（Markdown）：
  {{table_markdown}}
metadata:
  changelog: "v1 初版"
