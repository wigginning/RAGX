{{- if .Values.grafana.enabled }}
{{- $full := include "ragx.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragx.grafanaProvisioningConfigMap" . }}
  labels:
    {{- include "ragx.grafanaLabels" . | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ $full }}-prometheus:{{ .Values.prometheus.port }}
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: ragx
        orgId: 1
        folder: RAGX
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-grafana
  labels:
    {{- include "ragx.grafanaLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ragx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "ragx.grafanaLabels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "ragx"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ragx.secretName" . }}
                  key: grafana-admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "ragx.grafanaProvisioningConfigMap" . }}
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $full }}-grafana
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: dashboards
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-grafana
  labels:
    {{- include "ragx.grafanaLabels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.grafana.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | quote }}
  {{- if .Values.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.grafana.persistence.storageClass | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-grafana
  labels:
    {{- include "ragx.grafanaLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.grafana.port }}
      targetPort: http
  selector:
    {{- include "ragx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
