{{- if .Values.mockLlm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragx.fullname" . }}-mock-llm
  labels:
    {{- include "ragx.mockLlmLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mockLlm.replicaCount }}
  selector:
    matchLabels:
      {{- include "ragx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mock-llm
  template:
    metadata:
      labels:
        {{- include "ragx.mockLlmLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mock-llm
          image: {{ .Values.mockLlm.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.mockLlm.port }}
          command:
            - python
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def _send(self, obj, code=200):
                      body = json.dumps(obj).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def do_POST(self):
                      n = int(self.headers.get("Content-Length", 0))
                      json.loads(self.rfile.read(n) or b"{}")
                      self._send({
                          "id": "chatcmpl-mock",
                          "object": "chat.completion",
                          "model": "ragx-mock",
                          "choices": [{
                              "index": 0,
                              "message": {"role": "assistant",
                                          "content": "根据检索到的上下文，答案见引用 [1]。"},
                              "finish_reason": "stop",
                          }],
                          "usage": {"prompt_tokens": 100, "completion_tokens": 50,
                                    "total_tokens": 150},
                      })
                  def do_GET(self):
                      self._send({"status": "ok"})
              HTTPServer(("0.0.0.0", {{ .Values.mockLlm.port }}), H).serve_forever()
          {{- with .Values.mockLlm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragx.fullname" . }}-mock-llm
  labels:
    {{- include "ragx.mockLlmLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mockLlm.port }}
      targetPort: http
  selector:
    {{- include "ragx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mock-llm
{{- end }}
