# RAGX lite profile (RX-INF-01): zero external middleware, single process.
#
#   docker compose -f deploy/compose/lite.yml up -d --build
#   python scripts/smoke_lite.py
#
# The API runs SQLite (metadata + vector store on disk under /data) + local FS
# + in-process queue (auto_consume) + hash embedder. Chat/agentic generation is
# wired when an OpenAI-compatible endpoint is configured via RAGX_LLM_*;
# scripts/smoke_lite.py starts a tiny mock endpoint when none is given so the
# full upload -> query -> citations flow can be asserted end to end.
#
# All middleware (this project) shares the ``ragx`` compose project and the
# ``ragx-`` container prefix (11-plugins-builtin.md §11.3.3).
name: ragx

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ragx-api
    environment:
      # lite profile defaults (02-core.md §2.4) — kept explicit for clarity.
      RAGX_PROFILE: lite
      RAGX_DATA_DIR: /data
      # metadata + vector store on a shared volume so data survives restarts
      RAGX_PLUGINS.VECTOR_STORE.SQLITE.PATH: /data/ragx.db
      # auto-consume the in-process queue on startup (smoke upload -> query).
      # NOTE: Settings uses env_nested_delimiter=".", so nested fields are
      # RAGX_QUEUE.AUTO_CONSUME (dots), NOT RAGX_QUEUE_AUTO_CONSUME.
      RAGX_QUEUE.AUTO_CONSUME: "true"
      # OpenAI-compatible endpoint used by chat/agentic generation.
      # NOTE: providers is nested under settings.llm.providers, so the env
      # delimiter is a dot (RAGX_LLM.PROVIDERS...) — NOT an underscore.
      RAGX_LLM.PROVIDERS.OPENAI_COMPAT.BASE_URL: http://ragx-mock-llm:8001/v1
      RAGX_LLM.PROVIDERS.OPENAI_COMPAT.MODEL: ragx-mock
      # GENERATE role -> openai_compat / ragx-mock (standard final answer P12)
      RAGX_LLM.ROLES.GENERATE.PRIMARY.PROVIDER: openai_compat
      RAGX_LLM.ROLES.GENERATE.PRIMARY.MODEL: ragx-mock
      RAGX_LLM.ROLES.GENERATE.MAX_RETRIES: "1"
      RAGX_LLM.ROLES.GENERATE.TIMEOUT: "30"
      # EXTRACT role (KG off by default in lite, but keep the router happy)
      RAGX_LLM.ROLES.EXTRACT.PRIMARY.PROVIDER: openai_compat
      RAGX_LLM.ROLES.EXTRACT.PRIMARY.MODEL: ragx-mock
      RAGX_LLM.ROLES.EXTRACT.MAX_RETRIES: "1"
      RAGX_LLM.ROLES.EXTRACT.TIMEOUT: "30"
    ports:
      # host 18000 -> container 8000. Host port 8000 sits inside a Windows
      # Hyper-V/WSL2 reserved range (7925-8024) on this machine and would not
      # bind; 18000 is outside every reserved range. Smoke connects to 18000.
      - "18000:8000"
    volumes:
      - ragx-data:/data
    depends_on:
      - mock-llm
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Minimal OpenAI-compatible endpoint used by the smoke test so the full
  # upload -> query -> citations flow runs with zero external credentials.
  mock-llm:
    image: python:3.12-slim
    container_name: ragx-mock-llm
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def log_message(self, *a): pass
            def _send(self, obj, code=200):
                body = json.dumps(obj).encode()
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def do_POST(self):
                n = int(self.headers.get("Content-Length", 0))
                json.loads(self.rfile.read(n) or b"{}")
                self._send({
                    "id": "chatcmpl-mock",
                    "object": "chat.completion",
                    "model": "ragx-mock",
                    "choices": [{
                        "index": 0,
                        "message": {"role": "assistant",
                                    "content": "根据检索到的上下文，答案见引用 [1]。"},
                        "finish_reason": "stop",
                    }],
                    "usage": {"prompt_tokens": 100, "completion_tokens": 50,
                              "total_tokens": 150},
                })
            def do_GET(self):
                self._send({"status": "ok"})
        HTTPServer(("0.0.0.0", 8001), H).serve_forever()
    expose:
      - "8001"

volumes:
  ragx-data:
